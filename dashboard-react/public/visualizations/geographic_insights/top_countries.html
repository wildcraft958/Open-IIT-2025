<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html,body{margin:0;height:100%;background:transparent}</style>
  <script type="text/javascript">window.PlotlyConfig={MathJaxConfig:'local'};</script>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script>if(!window.Plotly){document.write('<script src="https://cdn.plot.ly/plotly-latest.min.js"><\/script>')}</script>
</head>
<body>
  <div>
    <div id="946a2460-a5a5-4228-8726-27f270387f61" class="plotly-graph-div" style="height:560px; width:100%;"></div>
    <script type="text/javascript">
      (function(){
        var elId = '946a2460-a5a5-4228-8726-27f270387f61';
        if (!document.getElementById(elId)) return;
        var data = [{
          hovertemplate: 'titles=%{x}<br>country=%{y}<extra></extra>',
          legendgroup: '',
          marker: { color: '#E50914', pattern: { shape: '' } },
          name: '',
          orientation: 'h',
          showlegend: false,
          textposition: 'auto',
          x: { dtype: 'i2', bdata: 'ag4WBD8DJgO9AYkBPgHoAOgA5wCpAKIAoAB1AHEAaQBnAGQAYQBbAA==' },
          xaxis: 'x',
          y: ['United States','India','Unknown','United Kingdom','Canada','France','Japan','Germany','Spain','South Korea','Mexico','China','Australia','Egypt','Türkiye','Hong Kong','Nigeria','Italy','Brazil','Argentina'],
          yaxis: 'y',
          type: 'bar'
        }];
        var layout = { title: { text: 'Top 20 Content-Producing Countries' }, xaxis: { title: { text: 'titles' } }, yaxis: { title: { text: 'country' } }, template: {
          data: { bar: [{ error_x: { color: '#2a3f5f' }, error_y: { color: '#2a3f5f' }, marker: { line: { color: '#E5ECF6', width: 0.5 }, pattern: { fillmode: 'overlay', size: 10, solidity: 0.2 } }, type: 'bar' }] },
          layout: { paper_bgcolor: 'white', plot_bgcolor: '#E5ECF6', font: { color: '#2a3f5f' } }
        }};
        Plotly.newPlot(elId, data, layout, {responsive:true});
        window.addEventListener('resize', function(){ var el = document.getElementById(elId); if (el && window.Plotly) { window.Plotly.Plots.resize(el); } });
      })();
    </script>
  </div>
</body>
